<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- the site in one glyph: a warm light in the dark -->
  <rect width="32" height="32" fill="#0A1418"/>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8C4" stop-opacity="1"/>
      <stop offset="28%" stop-color="#FFC46B" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#E3A94A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E3A94A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#g)"/>
  <circle cx="16" cy="16" r="3.4" fill="#FFF3DC"/>
</svg>

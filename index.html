<style>
  /* ------------------------------------------------------------------
     Critical CSS — inline so the card is correct with no JS, no build,
     no WebGL. This block must never depend on anything else loading.
     ------------------------------------------------------------------ */
  /* One scheme, and it is the world's. There was a light palette here, and
     it meant the machine that could not run the world got a bright card
     while every machine that could got dusk — two different sites depending
     on hardware. These values are the PALETTE from src/core/contract.ts, the
     same ones ui.css declares on #world, so the card is the world with the
     picture missing rather than a different page. Do not add a
     prefers-color-scheme branch back: --bg IS the clear colour the renderer
     paints, and the two have to agree. */
  :root{
    --bg:#0a1418;      /* PALETTE.night — the renderer's clear colour */
    --surface:#0e1a1e;
    --ink:#E9E4D6;     /* PALETTE.buff */
    --ink-2:#9FAEA6;   /* PALETTE.sage */
    --ink-3:#77867F;
    --rule:rgba(233,228,214,.14);
    --amber:#E3A94A;
    --amber-lit:#F3C77E;
    --paper:#E9E4D6;        /* PALETTE.buff — the film's paper */
    --paper-ink:#0A1418;
    --paper-ink-2:#4B5651;
    --paper-rule:rgba(10,20,24,.22);
    --font-display:"Hoefler Text","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --font-body:ui-sans-serif,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--amber)}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}

  /* ---------- the card ----------
     One block, centred, and that is the whole page. It is deliberately not a
     résumé: there was a full one here once, and it meant the visitor the world
     could not serve got handed the least interesting version of the thing —
     bullets and dates — as if that were the point. The name and three ways
     to reach him is the honest floor. */
  /* The page behind the card stays the renderer's clear colour (see above),
     but the card itself is a sheet of the film's paper: buff ground, dark
     ink, the way the projector's screen reads. One block on the night. */
  .card{
    min-height:100svh;display:grid;align-content:center;justify-items:start;
    padding:clamp(24px,6vw,48px) clamp(16px,5vw,32px);
  }
  .card__sheet{
    width:100%;max-width:520px;margin:0 auto;
    background:var(--paper);color:var(--paper-ink);
    padding:clamp(32px,8vw,56px) clamp(24px,6vw,44px);
    border-radius:6px;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(233,228,214,.08);
  }
  .card h1{
    margin:0 0 14px;font-family:var(--font-display);font-weight:600;
    font-size:clamp(2.1rem,7vw,3rem);letter-spacing:-.02em;line-height:1.05;
  }
  .card .note{
    margin:0;max-width:40ch;
    font-size:1rem;line-height:1.5;color:var(--paper-ink-2);
  }
  .card .contact{
    display:flex;flex-wrap:wrap;gap:0 8px;margin:22px 0 0;
    padding-top:18px;border-top:1px solid var(--paper-rule);
    font-size:.82rem;font-weight:500;letter-spacing:.02em;
  }
  /* Three links, and reaching him is the ONLY thing this page does — so they
     are 44px boxes, not 20px ones. The padding is symmetrical and the first
     link is pulled back by the same amount, so the words sit flush with the
     left edge of the name while the boxes stay full size. */
  .card .contact a{
    display:inline-flex;align-items:center;
    min-height:44px;padding:0 12px;
    color:var(--paper-ink);text-decoration:underline;
    text-decoration-color:var(--paper-rule);text-underline-offset:5px;
  }
  .card .contact a:first-child{margin-left:-12px}
  /* On a phone the row breaks and the orphan lands indented; a column is
     three lines that start where the name does. */
  @media (max-width:480px){
    .card .contact{flex-direction:column;gap:0}
    .card .contact a{margin-left:-12px}
  }
  .card .contact a:hover{text-decoration-color:var(--paper-ink)}

  /* ---------- the film, in words ----------
     One collapsed line under the addresses, and the whole film behind it —
     for the visitor the world cannot serve, who until now got the least of
     anyone, and for the machines: an assistant handed this address fetches
     THIS page, and the film is a texture it will never see. Generated from
     src/content/film.json by tools/agent-layer.ts, so it is the film's own
     words and cannot drift from them. Collapsed rather than hidden: text a
     page hides from people and shows to crawlers is a trick, and this is
     not one — anyone can open it. */
  .transcript{margin-top:6px;padding-top:6px;border-top:1px solid var(--paper-rule);color:var(--paper-ink-2)}
  .transcript summary{
    cursor:pointer;font-size:.82rem;font-weight:500;letter-spacing:.02em;
    color:var(--paper-ink);min-height:44px;display:flex;align-items:center;
  }
  /* flex on the summary drops the browser's own triangle, so it is drawn back
     by hand — a thing that opens has to look like it opens */
  .transcript summary::before{
    content:'';width:0;height:0;margin-right:10px;flex:none;
    border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;
    transition:transform .15s ease;
  }
  .transcript summary::-webkit-details-marker{display:none}
  .transcript[open] summary::before{transform:rotate(90deg)}
  .transcript summary:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--paper-rule)}
  .transcript__note{margin:4px 0 18px;font-size:.9rem;color:var(--paper-ink-2)}
  .transcript h2{
    margin:22px 0 4px;font-family:var(--font-mono);font-weight:500;font-size:.7rem;
    letter-spacing:.14em;text-transform:uppercase;color:var(--paper-ink-2);
  }
  .transcript p{margin:0;font-size:.98rem;line-height:1.55;color:var(--paper-ink)}

  /* ---------- the world (shown only once WebGL is confirmed) ----------
     The class is set by the inline script below, before the body is parsed,
     so the card never paints on a machine that is about to get the world
     instead. */
  #world{display:none}
  html.has-webgl #world{display:block}
  html.has-webgl body{
    background:var(--bg);overflow:hidden;overscroll-behavior:none;
    /* THE HELD FINGER IS OURS, NOT SAFARI'S.
       Walking is a held gesture — the button goes down on grass and the figure
       keeps walking for as long as it is down (onPointerDown in src/main.ts) —
       and half a second of a finger held still on a page is the exact input iOS
       reads as "select this". With nothing here to select it took the document,
       so crossing the field on a phone washed the whole screen blue and offered
       to copy it. touch-action on the canvas does not cover this: that governs
       scrolling and zooming, and selection is a separate machine.
       The three lines are three different behaviours, all of them wrong here:
       callout is the copy/paste bubble, user-select is the blue wash itself,
       tap-highlight is the grey flash a tap leaves behind.
       Scoped to html.has-webgl on purpose — the card lane is three contact
       links and copying the email address is the whole point of it. */
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  html.has-webgl .card{display:none}

  /* ---------- the load screen ----------
     One flat panel of the world's own black over the whole viewport from the
     first paint, lifted when there is a frame on the canvas. So a refresh
     goes dark → world, with nothing in between.

     It has to live here and not in src/style.css: everything the world
     imports arrives with the bundle, and this has to be on screen before the
     bundle is. It is also why it covers the HUD (z-index 999, over the 60 the
     film chrome uses) — in dev the chrome is markup before it is styled. */
  html.has-webgl body::before{
    content:'';position:fixed;inset:0;background:var(--bg);
    z-index:999;pointer-events:none;opacity:1;
    transition:opacity 1.2s ease .1s;
  }
  html.has-webgl.is-ready body::before{opacity:0}
  @media (prefers-reduced-motion: reduce){
    html.has-webgl body::before{transition:opacity .2s linear}
  }
</style>

<script>
  /* ------------------------------------------------------------------
     Which lane, decided before the first paint.

     This used to be main.ts's job, and a module script waits for the
     document — so the card painted for the whole time the bundle was in
     flight and then vanished, a flash of the wrong page on every refresh.
     The probe is cheap and the answer is only a class name, so it happens
     up here instead, before the body exists.

     No JS, no WebGL, or a bundle that never arrives all leave the class
     off, and the card is what you get — which is the right answer for
     all three.

     The answer also goes on `window`, not only on <html>: the class is
     presentation and the watchdog below can take it away, but whether
     this machine can run WebGL is a fact, and main.ts needs the fact.
     ------------------------------------------------------------------ */
  (function () {
    var root = document.documentElement
    try {
      var cv = document.createElement('canvas')
      var gl = window.WebGLRenderingContext &&
        (cv.getContext('webgl2') || cv.getContext('webgl'))
      if (!gl) return
      // hand the probe's context straight back — the renderer wants its own
      var lose = gl.getExtension('WEBGL_lose_context')
      if (lose) lose.loseContext()
      window.__webgl = true
      root.classList.add('has-webgl')
    } catch (e) {
      return
    }

    /* ------------------------------------------------------------------
       THE WATCHDOG — and the one question it is allowed to ask.

       It used to ask "is there a frame on the canvas yet", ten seconds
       in, and that is the wrong question, because the answer is no for
       reasons that have nothing to do with anything being broken. A tab
       that loads in the background is not serviced by
       requestAnimationFrame at all, so a link opened in a new tab, a
       restored session, a window that starts behind another window —
       all of them booted the world perfectly and then had the card
       swapped in underneath, permanently, ten seconds before anyone
       looked. That is the screen showing up far more than it should.

       The only thing this can honestly detect is A BUNDLE THAT NEVER
       RAN. So that is what it waits for, main.ts says when it has run,
       and a tab nobody is looking at is never judged.
       ------------------------------------------------------------------ */
    var timer = 0
    var settled = false

    /** main.ts, the moment the world is up. From here the card is over. */
    window.__worldBooted = function () {
      settled = true
      clearTimeout(timer)
    }

    function arm() { timer = setTimeout(giveUp, 20000) }

    function giveUp() {
      if (settled) return
      // a hidden tab has not failed at anything yet — ask again when it is
      // on screen, which is the first moment the answer matters
      if (document.hidden) {
        document.addEventListener('visibilitychange', function onShow() {
          document.removeEventListener('visibilitychange', onShow)
          if (!settled) arm()
        })
        return
      }
      root.classList.remove('has-webgl')
    }

    /* The genuine worst case does not need a timeout: a bundle that 404s
       or dies on the wire fires an error on the tag, and the card can be
       there at once instead of after a twenty-second stare into black.
       Capture phase — resource errors do not bubble. */
    window.addEventListener('error', function (e) {
      var el = e.target
      if (!settled && el && el !== window && el.tagName === 'SCRIPT') {
        settled = true
        clearTimeout(timer)
        root.classList.remove('has-webgl')
      }
    }, true)

    arm()
  })()
</script>
</head>
<body>

<!-- =====================================================================
     THE CARD — what you get on first byte, and all you get if the world
     never arrives: no JS, no WebGL, a bundle that times out, a renderer
     that throws on boot. Also what a crawler and a screen reader read.

     It is NOT a résumé, and there is not one anywhere on this site. The
     film the projector throws is the long version; this is the short one.
     If the film is ever unreachable the answer is to fix the film, not to
     grow this block back into a CV — it stays three lines.

     Three lines AND the film itself, in words, folded under them: a
     transcript is not a CV, it is the same story for a reader who cannot
     run the picture — a locked-down laptop, a screen reader, or the
     assistant somebody pasted this address into. It is generated from the
     film's copy, so it can only ever say what the film says.

     Hidden the moment WebGL is confirmed (html.has-webgl .card).
     ===================================================================== -->
<main class="card" id="card">
  <div class="card__sheet">
    <h1>Elliot Greenbaum</h1>
    <p class="note">
      A 3D world exists on this page for browsers that can run it. Check
      your settings.
    </p>
    <p class="contact">
      <a href="mailto:elliotgreenbaum@gmail.com">elliotgreenbaum@gmail.com</a>
      <a href="https://www.linkedin.com/in/elliot-greenbaum/">LinkedIn</a>
      <a href="https://x.com/elliotgreenbaum">X</a>
    </p>
    <!-- Replaced at build time (and on the dev server) with the film's words,
         act by act, as a collapsed <details>. See tools/agent-layer.ts. -->
    <!--@transcript-->
  </div>
</main>


<!-- =====================================================================
     THE WORLD
     ===================================================================== -->
<div id="world" aria-hidden="true">
  <canvas id="stage"></canvas>

  <!-- HUD
       No controls, and no menu. Everything on screen is a way-finder — a
       compass that points at the projector and a line of text telling you
       what to do when you get there. There is nothing here to navigate,
       because there is one thing to do. The time of day is not a setting
       either: the field opens on whatever the visitor's own sky is doing
       (src/core/sun.ts). The dev server alone grows a day/night switch in
       this corner, for looking at both — see src/ui/hud.ts. -->
  <div id="hud">
    <!-- the compass: one strip, the way a game HUD does it. Straight ahead is
         the middle, and each thing you can walk to rides along it by how far
         it sits to your left or right; whatever is behind you pins to an edge.
         Each marker names its destination, so the strip is an instruction
         rather than a puzzle. The projector's marker comes first: it is the
         thing the field is for, and verify reads the first name off it. -->
    <div id="compass" class="compass" aria-hidden="true">
      <i class="compass__rule"></i><i class="compass__tick"></i>
      <b class="compass__mark" data-mark="projector"><span></span><em>Projector</em></b>
      <b class="compass__mark" data-mark="elliot"><span></span><em>Elliot</em></b>
    </div>
    <p id="prompt"></p>

    <!-- The interaction badge, pinned in screen space to the switch on the
         projector once you are close enough to reach it — the thing every
         game floats over an interactable. It is positioned every frame from
         src/ui/interact.ts, which projects a world point through the camera;
         the outer div carries that translate and the pin inside it carries
         the centring, so the two never fight over `transform`.
         aria-hidden because it is a picture of a keyboard rather than
         information: #prompt above is the readable version.

         TWO HALVES OF THE SENTENCE AND ONLY ONE OF THEM IS EVER ON SCREEN.
         The badge names the gesture the device you are holding actually has:
         a keyboard gets PRESS [E], a touchscreen gets TAP, and the verb after
         it is the same string in both. The swap is CSS at `(hover: none)` —
         see src/ui/ui.css — so nothing measures anything at boot and a tablet
         that gains a keyboard gains the keycap. -->
    <div id="interact" data-on="false" data-hit="false" aria-hidden="true">
      <span class="interact__pin">
        <span class="interact__press">Press <kbd>E</kbd> to</span>
        <span class="interact__tap">Tap to</span>
        <span class="interact__verb">turn on</span>
      </span>
    </div>

    <!-- There was a fifth thing here: four arrow keys in the bottom-right
         corner, tapping themselves in a loop, as the one tutorial on the site.
         It is gone. Clicking the ground walks the figure there now, so the
         keyboard is no longer the only way across the field, and a permanent
         picture of a keyboard in the corner had become furniture. See the
         note where its styles used to be in src/ui/ui.css. -->
  </div>

  <!-- FULL SCREEN.
       The one control that only exists on a phone lying on its side, where
       the browser's own bar is eating the top of the picture and there is no
       other way to ask for it back. It is NOT in the HUD: the HUD fades out
       for the length of the film, and the film is when this is wanted most.
       src/ui/fullscreen.ts decides whether it is on screen at all — a browser
       with no Fullscreen API never shows it, because a button that does
       nothing is worse than no button. -->
  <button id="fs-btn" type="button" hidden data-on="false" aria-label="Full screen">
    <span class="fs-icon" aria-hidden="true"></span>
  </button>

  <!-- TLDR VERSION — the one control that is not on the bar.

       It floats just above the top-right corner of the screen, pinned in
       screen space to the corner of the frame and repositioned every frame
       from src/main.ts as the watching shot breathes, exactly the way the key
       badge is pinned to the switch. That is on purpose: it is an offer the
       PROJECTOR is making — wind the reel forward and give me the whole thing
       on one slide — and an offer parked in the corner of the transport bar
       reads as another playback control.

       It is OUTSIDE #film and not inside it, because #film animates on a
       transform, and an ancestor with a transform becomes the containing block
       for `position: fixed` children — which would quietly re-base this
       button's coordinates onto the bottom strip of the screen. Same reason
       the full-screen button above is outside #hud.

       src/film/controls.ts shows it with the rest of the chrome, hides it once
       the card is up (there is nothing left for it to do then), and owns the
       click. -->
  <button id="film-tldr" type="button" hidden data-on="false">
    <span class="film-ff" aria-hidden="true"></span>
    <span class="film-tldr__label">TLDR Version</span>
  </button>

  <!-- THE CONVERSATION — the panel you talk to Elliot in.

       He is a figure standing out in the field with a lantern and a nametag
       (src/world/landmarks/elliot.ts); walk up, press E, and this comes up
       (src/ui/chat.ts). The words in it are the only words on this site that
       were not written in advance: an AI with Elliot's own notes about
       himself answers, live. The model says so if anyone asks. Nothing on
       the panel labels him, because a person with a disclaimer pinned to his
       chest is not a person you talk to.

       Empty on purpose: the questions are all in
       src/content/talk.json and are written in by chat.ts at boot, so the
       copy lives with the rest of the site's words. Outside #hud, because the
       HUD fades out while this is up, and it sits at the film bar's own layer
       for the same reason the film bar does. -->
  <section id="talk" hidden role="dialog" aria-label="Talk to Elliot" data-busy="false">
    <header class="talk__head">
      <h2 class="talk__name">Elliot</h2>
      <button id="talk-close" type="button">Leave <kbd aria-hidden="true">esc</kbd></button>
    </header>
    <!-- what is true right now, live from his accounts — filled by chat.ts
         from /api/live when the panel opens; stays hidden when there is nothing -->
    <div id="talk-body" class="talk__body">
      <ul id="talk-now" class="talk__facts" hidden aria-label="Live from Elliot’s accounts"></ul>
      <ol id="talk-log"></ol>
    </div>
    <div id="talk-asks" role="group" aria-label="Questions to ask"></div>
    <form id="talk-form" autocomplete="off">
      <input id="talk-input" type="text" name="q" aria-label="Your question" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" />
      <button id="talk-send" type="submit" aria-label="Ask"><span aria-hidden="true">→</span></button>
    </form>
    <p id="talk-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </section>

  <!-- The film's controls.
       The picture itself is NOT here — it is a texture on the projector
       screen out in the world, and you watch it from where you are standing.
       This is the transport: chaptered scrubber, pause, running time. The
       chapter segments are built from the act list at boot, in
       src/film/controls.ts, so adding an act adds a chapter. -->
  <div id="film" hidden aria-label="Film controls">
    <p id="film-caption" aria-live="polite"></p>
    <div id="film-ctl">
      <div id="film-scrub"><div id="film-tip" hidden></div></div>
      <div id="film-row">
        <button id="film-play" type="button" aria-label="Pause" data-paused="false">
          <span class="film-icon" aria-hidden="true"></span>
        </button>
        <span id="film-time">0:00 / 0:00</span>
        <span id="film-chapter"></span>
        <!-- The speed picker. One button per entry in RATES (src/film/film.ts),
             built at boot in src/film/controls.ts — so this is an empty shell
             and the speeds live in one place. It is a radio group: exactly one
             is on, pressing one turns the others off, and holding Space still
             shuttles to 2x on top of whatever is chosen. -->
        <div id="film-speed" role="radiogroup" aria-label="Playback speed"></div>
        <button id="film-skip" type="button">Exit</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
